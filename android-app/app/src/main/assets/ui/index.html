<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>E6 Studio Mobile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>E6 Studio</h1>
    <button id="buyBtn" class="primary">Купить Pro</button>
  </header>

  <section class="filters">
    <input id="tagInput" placeholder="Теги (пример: cat safe)" />
    <select id="ratingFilter">
      <option value="all">Все рейтинги</option>
      <option value="s">Safe</option>
      <option value="q">Questionable</option>
      <option value="e">Explicit</option>
    </select>
    <button id="searchBtn">Поиск</button>
  </section>

  <main>
    <div id="cards" class="cards"></div>
  </main>

  <nav class="bottom-menu">
    <button data-tab="feed" class="active">Лента</button>
    <button data-tab="favorites">Избранное</button>
    <button data-tab="settings">Настройки</button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
